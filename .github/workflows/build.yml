name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.keystore

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |

          if [ ! -s "$KEYSTORE_FILE" ]; then
            unset KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            echo "No keystore available, building unsigned APK"
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          cp "$APK" "player-v${VERSION}-release.apk"
          echo "APK_NAME=player-v${VERSION}-release.apk" >> "$GITHUB_ENV"

      - name: Compute APK SHA-256
        run: |
          sha256sum "$APK_NAME" | awk '{print $1}' > "$APK_NAME.sha256"
          echo "SHA256=$(cat "$APK_NAME.sha256")" >> "$GITHUB_ENV"
          echo "更新包 SHA-256：$SHA256"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256

  release:

    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apk

      - name: Extract release notes
        run: |
          jq -r '.notes' version.json > release-notes.txt
          SHA=$(cat apk/player-*-release.apk.sha256)
          printf '\n\nSHA-256: %s\n' "$SHA" >> release-notes.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.txt
          files: |
            apk/player-*-release.apk
            apk/player-*-release.apk.sha256
