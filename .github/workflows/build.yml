name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 从 Secrets 还原签名密钥（base64 编码的 keystore 文件 + 密码）。
      # fork PR 等无 Secrets 的场景解码产物为空文件，由下一步检测并回退为无签名构建
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 无可用 keystore（fork PR / Secrets 缺失）时清除签名环境变量，
          # Gradle 侧回退为无签名产物（*-unsigned.apk），构建不失败
          if [ ! -s "$KEYSTORE_FILE" ]; then
            unset KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            echo "No keystore available, building unsigned APK"
          fi
          ./gradlew assembleRelease --no-daemon

      # 重命名为 player-v{版本}-release.apk（有签名为 app-release.apk，无签名为 *-unsigned.apk，通配兼容）
      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          cp "$APK" "player-v${VERSION}-release.apk"
          echo "APK_NAME=player-v${VERSION}-release.apk" >> "$GITHUB_ENV"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: ${{ env.APK_NAME }}

  release:
    # 仅打 tag (v*) 时发布到 GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apk

      - name: Extract release notes
        run: jq -r '.notes' version.json > release-notes.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.txt
          files: apk/player-*-release.apk
