name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate version.json
        run: |
          VERSION_NAME=$(jq -r '.versionName // empty' version.json)
          VERSION_CODE=$(jq -r '.versionCode // empty' version.json)
          NOTES=$(jq -r '.notes // empty' version.json)
          if [ -z "$VERSION_NAME" ] || ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 0 ]; then
            echo "::error::version.json 需要有效的 versionName 与 versionCode"
            exit 1
          fi
          if [ -z "$NOTES" ]; then
            echo "::error::version.json 缺少更新说明 notes"
            exit 1
          fi
          if echo "$NOTES" | grep -Eiq 'sha-?256'; then
            echo "::error::version.json 的 notes 不应包含 SHA-256（校验和由 .sha256 附件提供）"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与 version.json 的 versionName ${VERSION_NAME} 不一致"
              exit 1
            fi
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.keystore

      - name: Require signing secrets for tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -s "$RUNNER_TEMP/release.keystore" || {
            echo "::error::tag 构建缺少 KEYSTORE_BASE64"
            exit 1
          }
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::tag 构建缺少签名密码 / alias"
            exit 1
          }

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -s "$KEYSTORE_FILE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::tag 构建必须使用签名包"
              exit 1
            fi
            unset KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            echo "No keystore available, building unsigned APK"
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(jq -r '.versionName' version.json)
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$APK" == *unsigned* ]]; then
            echo "::error::tag 构建产出了未签名 APK"
            exit 1
          fi
          cp "$APK" "player-v${VERSION}-release.apk"
          echo "APK_NAME=player-v${VERSION}-release.apk" >> "$GITHUB_ENV"

      - name: Verify APK versionName
        run: |
          AAPT2=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt2 | sort -V | tail -n 1)
          test -n "$AAPT2" || {
            echo "::error::找不到 aapt2"
            exit 1
          }
          EXPECTED=$(jq -r '.versionName' version.json)
          ACTUAL=$("$AAPT2" dump badging "$APK_NAME" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK versionName ${ACTUAL} 与 version.json ${EXPECTED} 不一致"
            exit 1
          fi

      - name: Verify APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER" || {
            echo "::error::找不到 apksigner"
            exit 1
          }
          "$APKSIGNER" verify --print-certs "$APK_NAME"

      - name: Compute APK SHA-256
        run: |
          sha256sum "$APK_NAME" | awk '{print $1}' > "$APK_NAME.sha256"
          echo "SHA256=$(cat "$APK_NAME.sha256")" >> "$GITHUB_ENV"
          echo "更新包 SHA-256：$SHA256"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256

  release:

    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apk

      - name: Extract release notes
        run: |
          # 更新说明只取结构化 notes；校验和放在 .sha256 附件里，不写进展示正文
          jq -r '.notes' version.json > release-notes.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.txt
          files: |
            apk/player-*-release.apk
            apk/player-*-release.apk.sha256
